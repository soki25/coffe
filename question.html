<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ</title>
</head>
<body>
    <main>
            
        <div class="question-main">
            <h1>Contact</h1>
            <p>お問い合わせ</p>
            <p>ご質問やご相談は、お電話またはフォームからお気軽にどうぞ。</p>
        </div>

        <p>Get in touch</p>

        <div class="question-contact">
            <h1>連絡先</h1>

            <ul>
                <li>電話</li>
                <th>0852-XX-XXXX</th>
            </ul>

            <ul>
                <li>メール</li>
                <th>info@example.com</th>
            </ul>

            <ul>
                <li>受付時間</li>
                <th>営業時間内(営業時間・定休日はアクセスページをご覧ください)</th>
            </ul>
        </div>

        <div class="question-form">
            <ul>
                <li>お名前</li>
                <th><input type="text"></th>
            </ul>

            <ul>
                <li>電話番号またはメールアドレス</li>
                <th><input type="text"></th>
            </ul>

        </div>

        <p>ご用件の種類</p>
        <input type="radio" name="gender" value="お問い合わせ" checked> お問い合わせ
        <input type="radio" name="gender" value="来店予約"> 来店予約

        <div>
            <p>内容</p>

        </div>
    </main>

    <footer>

    </footer>
</body>
</html>
